# Incus profile for the EYG factory "golden image" VM.
#
# Use with the Debian 13 (trixie) *cloud* image variant; the plain variant
# doesn't ship cloud-init:
#
#   incus profile create eyg-golden --project factory
#   incus profile edit eyg-golden --project factory < configfiles/incus-eyg-golden-profile.yaml
#   incus launch images:debian/13/cloud eyg-golden-build --project factory --vm -p default -p eyg-golden
#
# See scripts/build-golden-image.sh for the full build-and-publish flow.
description: EYG factory golden image (git, rust, uv/python, claude, eyg)
config:
  limits.cpu: "1"
  limits.memory: 4GiB
  # Stop the agent from auto-updating Claude Code underneath us; bump it by
  # rebuilding the golden image instead.
  environment.DISABLE_AUTOUPDATER: "1"
  cloud-init.user-data: |
    #cloud-config
    users:
      - name: agent
        gecos: EYG factory agent
        shell: /bin/bash
        groups: [sudo]
        sudo: "ALL=(ALL) NOPASSWD:ALL"
        lock_passwd: true

    package_update: true
    package_upgrade: true
    packages:
      - build-essential
      - ca-certificates
      - curl
      - git
      - jq
      - pkg-config
      - libssl-dev
      - ripgrep
      - unzip

    write_files:
      # Make the per-user toolchains visible to login shells.
      - path: /etc/profile.d/eyg-toolchains.sh
        permissions: "0644"
        content: |
          [ -d "$HOME/.cargo/bin" ] && PATH="$HOME/.cargo/bin:$PATH"
          [ -d "$HOME/.local/bin" ] && PATH="$HOME/.local/bin:$PATH"
          export PATH
          export DISABLE_AUTOUPDATER=1

    runcmd:
      - runuser -l agent -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path'
      - runuser -l agent -c 'curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh'
      - runuser -l agent -c 'uv python install --default --preview'
      - runuser -l agent -c 'curl -fsSL https://claude.ai/install.sh | bash'
      - runuser -l agent -c 'curl -fsSL https://eyg.run/install | bash'
      - install -d -o agent -g agent /home/agent/work
      - touch /var/lib/eyg-golden-ready
devices:
  root:
    path: /
    pool: default
    type: disk
    size: 20GiB
