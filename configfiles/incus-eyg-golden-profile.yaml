# Incus profile for the EYG factory "golden image" VM.
#
# Use with the Debian 13 (trixie) *cloud* image variant; the plain variant
# doesn't ship cloud-init:
#
#   incus profile create eyg-golden
#   incus profile edit eyg-golden < configfiles/incus-eyg-golden-profile.yaml
#   incus launch images:debian/13/cloud eyg-golden-build --vm -p default -p eyg-golden
#
# See scripts/build-golden-image.sh for the full build-and-publish flow.
description: EYG factory golden image (git, node, rust, uv/python, claude, eyg-run)
config:
  limits.cpu: "1"
  limits.memory: 4GiB
  # Stop the agent from auto-updating Claude Code underneath us; bump it by
  # rebuilding the golden image instead.
  environment.DISABLE_AUTOUPDATER: "1"
  cloud-init.user-data: |
    #cloud-config
    users:
      - name: agent
        gecos: EYG factory agent
        shell: /bin/bash
        groups: [sudo]
        sudo: "ALL=(ALL) NOPASSWD:ALL"
        lock_passwd: true

    apt:
      sources:
        nodesource:
          source: "deb [signed-by=$KEY_FILE] https://deb.nodesource.com/node_24.x nodistro main"
