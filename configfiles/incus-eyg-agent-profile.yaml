# Network profile for EYG factory agent VMs. Apply *after* eyg-golden so this
# eth0 replaces the default profile's unrestricted one; scripts/launch-vm.sh
# does this and checks the result.
description: EYG factory agent network (see incus-acl-eyg-agent.yaml)
config:
  # Claude Code's telemetry hosts are blocked; don't wait on them.
  environment.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
devices:
  eth0:
    type: nic
    name: eth0
    network: eygbr0
    security.acls: eyg-agent
    security.acls.default.egress.action: reject
    security.acls.default.ingress.action: reject
    security.port_isolation: "true"
    security.mac_filtering: "true"
    security.ipv4_filtering: "true"
