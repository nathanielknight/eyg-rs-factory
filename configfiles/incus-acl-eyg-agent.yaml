# Agent VMs: the coordinator port on the host, plus Anthropic's published
# inbound API range (https://platform.claude.com/docs/en/api/ip-addresses).
description: EYG factory agent - host coordinator port and Anthropic API
egress:
  # NIC-level ACLs get no built-in DHCP/DNS rules, so allow them explicitly.
  # DHCP discover is broadcast; ipv4_filtering on the NIC already pins the
  # source address.
  - action: allow
    protocol: udp
    destination_port: "67"
    description: DHCP
    state: enabled
  - action: allow
    protocol: udp
    destination: 10.196.0.1/32
    destination_port: "53"
    description: DNS (dnsmasq only forwards anthropic.com)
    state: enabled
  - action: allow
    protocol: tcp
    destination: 10.196.0.1/32
    destination_port: "53"
    description: DNS over TCP
    state: enabled
  - action: allow
    protocol: tcp
    destination: 10.196.0.1/32
    destination_port: "8080"
    description: coordinator API
    state: enabled
  - action: allow
    protocol: tcp
    destination: 160.79.104.0/23
    destination_port: "443"
    description: Anthropic API
    state: enabled
ingress:
  - action: allow
    protocol: udp
    source: 10.196.0.1/32
    source_port: "67"
    description: DHCP replies
    state: enabled
