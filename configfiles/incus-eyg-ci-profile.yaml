# Network profile for EYG factory ci VMs. Apply *after* eyg-golden so this
# eth0 replaces the default profile's unrestricted one; scripts/launch-vm.sh
# does this and checks the result. Filtering is the eygcibr0 bridge's ACL.
description: EYG factory ci network (eygcibr0; see incus-acl-eyg-ci.yaml)
config: {}
devices:
  eth0:
    type: nic
    name: eth0
    network: eygcibr0
    security.port_isolation: "true"
    security.mac_filtering: "true"
    security.ipv4_filtering: "true"
