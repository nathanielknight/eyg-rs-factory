# Bridge for EYG factory CI VMs; agent VMs use eygagentbr0. The bridge
# carries the eyg-ci ACL, so anything on it gets CI's limits (see
# incus-eygagentbr0-network.yaml for why the ACLs aren't on the NICs).
description: EYG factory CI VMs
config:
  ipv4.address: 10.197.0.1/24
  ipv4.nat: "true"
  ipv6.address: none
  security.acls: eyg-ci
  security.acls.default.egress.action: reject
  security.acls.default.ingress.action: reject
  # Incus always allows DNS to the bridge, so dnsmasq itself must refuse to
  # forward anything (otherwise DNS is an exfiltration channel).
  raw.dnsmasq: |
    no-resolv
